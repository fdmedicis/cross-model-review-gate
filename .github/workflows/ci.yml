# The gate's own CI: offline tests on every PR and push to main.
# No API key needed: these cover everything code decides, plus fail-closed paths.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Known-bad / known-good suite (code-decided cases)
        run: python -m gate eval --offline
